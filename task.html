<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 40px;
        }

        .card {
            max-width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c7be5;
            margin-top: 0;
        }

        ul {
            line-height: 1.8;
        }

        button {
            background-color: #2c7be5;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1a5fb4;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello, World!</h1>
        <p>Welcome to my first web page. This is a simple page made with HTML and a little bit of CSS.</p>

        <h2>Things I am learning</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Java</li>
        </ul>

        <button>Click Me</button>
    </div>
</body>
</html>
